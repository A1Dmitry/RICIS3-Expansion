name: Restore Map3D
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-map3d.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Map3D from 1d3faa4
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show 1d3faa4:src/ui/Map3D.tsx > src/ui/Map3D.tsx
          wc -c src/ui/Map3D.tsx
          test $(wc -c < src/ui/Map3D.tsx) -gt 20000
          git add src/ui/Map3D.tsx
          git status
          git commit -m "fix: restore full Map3D.tsx from v0.3.21 (1d3faa4)" || echo nothing
          git push origin HEAD:main || git push origin HEAD:main --force-with-lease
