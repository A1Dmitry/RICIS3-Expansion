name: widen-card
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/widen-card.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Widen card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/ui/Map3D.tsx')
          t = p.read_text(encoding='utf-8')
          old = "${isNodeExpanded ? 'w-[600px]' : 'w-80'}"
          new = "${isNodeExpanded ? 'w-[640px]' : 'w-[26rem]'}"
          if old not in t:
              print('pattern not found or already patched')
          else:
              p.write_text(t.replace(old, new, 1), encoding='utf-8')
              print('patched')
          PY
      - name: Commit if changed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/ui/Map3D.tsx
          git diff --cached --quiet && echo 'no change' || (git commit -m 'ui: widen node card panel (26rem / 640px)' && git push)
